<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#051a3a">
<title>ARCANE — Event Registration</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#051a3a}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
.page{
  min-height:100svh;
  padding:56vh 16px 30px;
  position:relative;
  overflow:hidden;
}
.page::before{
  content:"";
  position:absolute;
  z-index:0;
  inset:0;
  background:
    linear-gradient(to bottom,rgba(2,12,32,0) 0%,rgba(2,12,32,.03) 55%,rgba(2,12,32,.38) 100%),
    url("arcane-bg.webp") center top/cover no-repeat;
}
.content{
  position:relative;
  z-index:1;
  width:min(100%,440px);
  margin:0 auto;
}
.events{display:grid;gap:12px}
.event{
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:11px 12px 11px 18px;
  color:#fff;
  text-decoration:none;
  border:1px solid rgba(210,230,255,.34);
  border-radius:13px;
  background:rgba(3,25,57,.64);
  box-shadow:0 7px 24px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
.event:active{transform:scale(.985)}
.title{font-size:14px;font-weight:700;letter-spacing:.055em;line-height:1.3}
.register{
  flex:0 0 auto;
  padding:9px 12px;
  border-radius:8px;
  background:#edf5ff;
  color:#08204a;
  font-size:9px;
  font-weight:800;
  letter-spacing:.13em;
}
.footer{
  position:relative;
  z-index:1;
  text-align:center;
  margin-top:20px;
  font-size:8px;
  letter-spacing:.22em;
  opacity:.62;
}
@media(max-height:700px){
  .page{padding-top:44vh}
  .event{min-height:56px}
}
</style>
</head>
<body>
<main class="page">
  <div class="content">
    <section class="events">
      <a class="event" href="https://docs.google.com/forms/d/e/1FAIpQLSezw95JFk4NtQCgSZzVIMUycV4_vwfzpMsZOrib39kj6UfxKw/viewform" target="_blank" rel="noopener noreferrer">
        <span class="title">BGMI LAN</span>
        <span class="register">REGISTER</span>
      </a>
<a class="event" href="https://docs.google.com/forms/d/e/1FAIpQLScvy3mlrzvTIhbFRLqW3l0IGbUEIVMC3rQ2GM76Wr3tWoaK-g/viewform" target="_blank" rel="noopener noreferrer">
        <span class="title">FREE FIRE LAN</span>
        <span class="register">REGISTER</span>
      </a>
<a class="event" href="https://docs.google.com/forms/d/e/1FAIpQLSdFVI8lSI_UzUv_9njvBHb94fs6n86S5w3GScr3PqVpxaM3ng/viewform" target="_blank" rel="noopener noreferrer">
        <span class="title">PHOTOGRAPHY</span>
        <span class="register">REGISTER</span>
      </a>
<a class="event" href="https://docs.google.com/forms/d/e/1FAIpQLSdi67N2LdXMxrH1bx1x0VyLkfmX5Cs50VxRE2YjI_ejOW-7eg/viewform" target="_blank" rel="noopener noreferrer">
        <span class="title">OFF BEAT — STREET DANCE</span>
        <span class="register">REGISTER</span>
      </a>
<a class="event" href="https://docs.google.com/forms/d/e/1FAIpQLSfe2u-eJzZwkkNpFXq_ojXCbFCxcKjHrE6AVSiwCU9LDTp64g/viewform" target="_blank" rel="noopener noreferrer">
        <span class="title">CYPHER — RAP BATTLE</span>
        <span class="register">REGISTER</span>
      </a>
<a class="event" href="https://docs.google.com/forms/d/e/1FAIpQLSfutruGZPCtmWkBcrnZlt2QBEqCykx91YcAJf_6j2MxzU_FcA/viewform" target="_blank" rel="noopener noreferrer">
        <span class="title">ARCANE — VOX VERITAS</span>
        <span class="register">REGISTER</span>
      </a>
    </section>
  </div>
  <div class="footer">ARCANE • EVENT REGISTRATION</div>
</main>
</body>
</html>
